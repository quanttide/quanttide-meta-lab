[package]
name = "quanttide-meta-lab-cli"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "reflect"
path = "src/lib.rs"

[[bin]]
name = "reflect"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
